# PreViPS Configuration
# ======================
# Multi-view Video-Pose Pretraining for Surgical Activity Recognition.
# Based on arXiv:2502.13883 (Hamoud et al., 2025).

dataset:
  name: mvor
  data_root: data/mvor/
  annotation_path: data/mvor/annotations/camma_mvor_2018.json
  num_classes: 4
  phase_names:
    - "Idle/Empty"
    - "Preparation"
    - "Procedure Active"
    - "Closure/Cleanup"
  train_days: [2, 3]
  val_days: [4]
  test_days: [1]
  camera_ids: [1, 2, 3]
  primary_camera: 1

phase_labeler:
  num_clinician_threshold: 2
  temporal_smooth_window: 3
  use_temporal_context: true

model:
  type: previps
  backbone: resnet50
  pretrained: true
  embed_dim: 256
  # Pose tokenizer
  num_joints: 10          # CAMMA upper-body keypoints
  codebook_size: 512
  num_pose_tokens: 4
  # Pose transformer
  pose_layers: 6
  pose_heads: 8
  max_persons: 8
  max_frames: 16
  max_views: 6
  dropout: 0.1
  # LSTM/classifier (for finetuning with temporal model)
  lstm_hidden: 512
  lstm_layers: 2
  sequence_length: 5

# Pretraining settings (video-pose alignment)
pretraining:
  epochs: 50
  batch_size: 4
  learning_rate: 0.01
  weight_decay: 0.00001
  temperature: 0.07        # InfoNCE temperature
  lambda_geo: 0.5          # Geometric consistency weight
  lambda_mask: 0.5         # Masked pose prediction weight
  mask_ratio: 0.15         # Fraction of pose tokens to mask
  sequence_length: 8       # Frames per clip during pretraining
  num_workers: 2

# Finetuning settings (downstream phase classification)
training:
  batch_size: 4
  learning_rate: 0.0001
  weight_decay: 0.00001
  epochs: 30
  early_stopping_patience: 8
  scheduler: cosine
  scheduler_params:
    T_max: 30
  class_weights: auto
  gradient_clip: 1.0
  num_workers: 2
  pin_memory: true
  mixed_precision: true

preprocessing:
  image_size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

augmentation:
  enabled: true
  horizontal_flip: 0.5
  brightness: 0.3
  contrast: 0.3
  saturation: 0.2
  hue: 0.05
  rotation: 15

logging:
  log_dir: logs/
  checkpoint_dir: checkpoints/
  save_every: 10
  log_every: 10
  tensorboard: true
  experiment_name: previps_mvor

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - jaccard
    - confusion_matrix
